plugins {
    id 'java'
    id 'maven-publish'
    id 'me.champeau.jmh' version '0.7.2'
    id 'com.gradleup.shadow' version '9.2.0'
//    id "com.vanniktech.maven.publish" version "0.36.0"
//    id 'signing'
}

// API compatibility checking against the last published release (see docs/api-compatibility.md).
apply plugin: 'dev.vfyjxf.taffy.api-compatibility'

group = 'dev.vfyjxf'
version = '1.1.4'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

dependencies {
//    implementation 'org.jetbrains:annotations:25.0.0'
    implementation("it.unimi.dsi:fastutil:8.5.12")


    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Gson for JSON parsing in tests
    testImplementation 'com.google.code.gson:gson:2.10.1'

    // JMH for benchmarking
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

shadowJar {
    minimize()

    relocate 'it.unimi.dsi.fastutil', 'dev.vfyjxf.taffy.shadow.fastutil'
}

jmh {
    // Defaults are a fast smoke profile: 1 warmup + 1 measurement iteration, one fork.
    // For a stable comparison run, override them from the command line, for example:
    //   ./gradlew jmh -PjmhWarmupIterations=3 -PjmhIterations=5 -PjmhFork=2
    warmupIterations = (project.findProperty('jmhWarmupIterations') ?: 1) as int
    iterations = (project.findProperty('jmhIterations') ?: 1) as int
    fork = (project.findProperty('jmhFork') ?: 1) as int

    // Include all benchmark classes using full regex pattern.
    // Both patterns can be overridden to run a subset:
    //   ./gradlew jmh -PjmhIncludes='.*FlexScenarioBenchmark.*'
    includes = [(project.findProperty('jmhIncludes') ?: '.*Benchmark.*') as String]

    // Extended benchmarks (100k-node inputs) are opt-in via the `jmhExtended` task.
    excludes = [(project.findProperty('jmhExcludes') ?: '.*ExtendedBenchmark.*') as String]

    // JMH options
    jmhVersion = '1.37'
    resultFormat = 'JSON'
    resultsFile = project.file("${project.buildDir}/reports/jmh/results.json")

    // Increase stack size for deep recursion benchmarks (depth=1000)
    jvmArgs = ['-Xss16m']
}

// Large-input benchmarks (100k-node PanGUI/tree workloads) are excluded from the default
// `jmh` task. Run them explicitly with:
//   ./gradlew jmhExtended
// Override iterations with -PjmhExtendedWarmupIterations / -PjmhExtendedIterations.
tasks.register('jmhExtended', me.champeau.jmh.JMHTask) {
    group = 'jmh'
    description = 'Runs the large (Extended) JMH benchmarks excluded from the default jmh task.'

    jmhClasspath.from(configurations.jmh)
    testRuntimeClasspath.from(configurations.jmhRuntimeClasspath)
    jarArchive.set(tasks.named('jmhJar').flatMap { it.archiveFile })

    includes = [(project.findProperty('jmhExtendedIncludes') ?: '.*ExtendedBenchmark.*') as String]
    excludes = []
    warmupIterations = (project.findProperty('jmhExtendedWarmupIterations') ?: 1) as int
    iterations = (project.findProperty('jmhExtendedIterations') ?: 2) as int
    fork = 1
    resultFormat = 'JSON'
    resultsFile = project.file("${project.buildDir}/reports/jmh/results-extended.json")
    humanOutputFile = project.file("${project.buildDir}/reports/jmh/output-extended.txt")
    jvmArgs = ['-Xss16m']
}

test {
    useJUnitPlatform()
    // Forward the golden-update switch from the Gradle CLI (-D...) to the test JVM.
    // Usage: ./gradlew test --tests 'dev.vfyjxf.taffy.compat.*' -Dtaffy.compat.updateGolden=true
    systemProperty 'taffy.compat.updateGolden', System.getProperty('taffy.compat.updateGolden', 'false')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}



publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = project.group
            artifactId = 'taffy'
            version = project.version
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

