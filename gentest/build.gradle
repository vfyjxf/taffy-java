plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.16.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.github.bonigarcia:webdrivermanager:5.6.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'dev.vfyjxf.taffy.gentest.Generator'
}

// ---------------------------------------------------------------------------
// Cross-platform defaults
//
// Everything below can be overridden with -P properties or environment
// variables. No machine-specific (Windows) path is baked into the build.
// ---------------------------------------------------------------------------
def projectRoot = rootProject.projectDir
def sourceRoot = new File(projectRoot, 'src/test/java')

def resolvePath = { String propertyName, String environmentName, File fallback ->
    def raw = project.findProperty(propertyName)
    if (raw == null || raw.toString().isBlank()) {
        raw = System.getenv(environmentName)
    }
    if (raw == null || raw.toString().isBlank()) {
        return fallback
    }
    def file = new File(raw.toString())
    return file.isAbsolute() ? file : new File(projectRoot, raw.toString())
}

def outputRoot = resolvePath('outRoot', 'GEN_OUT_ROOT', sourceRoot)
def taffyRoot = resolvePath('taffyRoot', 'TAFFY_ROOT', new File(projectRoot.parentFile, 'taffy'))
def wptRoot = resolvePath('wptRoot', 'WPT_ROOT', new File(projectRoot.parentFile, 'wpt'))
def wptCssRoot = resolvePath('wptCssRoot', 'WPT_CSS_ROOT', wptRoot)
def chromeBinary = project.findProperty('chromeBinary') ?:
        System.getenv('TAFFY_CHROME_BINARY') ?:
        System.getenv('CHROME_BIN') ?:
        System.getenv('CHROME_PATH')
def chromeDriver = project.findProperty('chromeDriver') ?:
        System.getenv('TAFFY_CHROME_DRIVER') ?:
        System.getenv('CHROMEDRIVER')

def browserArgs = []
if (chromeBinary != null && !chromeBinary.toString().isBlank()) {
    def file = new File(chromeBinary.toString())
    browserArgs += ['--chrome-binary', (file.isAbsolute() ? file : new File(projectRoot, chromeBinary.toString())).absolutePath]
}
if (chromeDriver != null && !chromeDriver.toString().isBlank()) {
    def file = new File(chromeDriver.toString())
    browserArgs += ['--chrome-driver', (file.isAbsolute() ? file : new File(projectRoot, chromeDriver.toString())).absolutePath]
}

def outputArgs = ['--out', outputRoot.absolutePath] + browserArgs

def taffyArgs = ['--source', 'taffy',
                 '--taffy-root', taffyRoot.absolutePath,
                 '--package', 'dev.vfyjxf.taffy.generated'] + outputArgs
if (project.hasProperty('category')) {
    taffyArgs += ['--category', project.property('category').toString()]
}
if (project.hasProperty('filter')) {
    taffyArgs += ['--filter', project.property('filter').toString()]
}
if (project.hasProperty('filterFile')) {
    taffyArgs += ['--filter-file', new File(projectRoot, project.property('filterFile').toString()).absolutePath]
}

def wptArgs = ['--source', 'wpt',
               '--wpt-root', wptRoot.absolutePath,
               '--package', 'dev.vfyjxf.taffy.wpt'] + outputArgs
if (project.hasProperty('wptSuites')) {
    wptArgs += ['--wpt-suites', project.property('wptSuites').toString()]
}
if (project.hasProperty('category')) {
    wptArgs += ['--category', project.property('category').toString()]
}
if (project.hasProperty('filter')) {
    wptArgs += ['--filter', project.property('filter').toString()]
}
if (project.hasProperty('filterFile')) {
    wptArgs += ['--filter-file', new File(projectRoot, project.property('filterFile').toString()).absolutePath]
}

def requireDirectories = { directories ->
    directories.each { directory ->
        if (!directory.isDirectory()) {
            throw new GradleException(
                    "Required directory does not exist: ${directory}\n" +
                    "Configure it with -PtaffyRoot=.../-PwptRoot=... or TAFFY_ROOT/WPT_ROOT.\n" +
                    "Expected a Rust taffy checkout containing test_fixtures/ or a WPT checkout containing css/.")
        }
    }
}

def registerGenerator = { name, description, arguments, requiredDirs ->
    tasks.register(name, JavaExec) {
        group = 'generate'
        description = description
        mainClass = 'dev.vfyjxf.taffy.gentest.Generator'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectRoot
        setArgs(arguments)
        doFirst {
            requireDirectories(requiredDirs)
        }
    }
}

registerGenerator('genTaffy',
        'Generate Java tests from Rust taffy HTML fixtures (all categories, or -Pcategory=flex)',
        taffyArgs, [taffyRoot])

registerGenerator('genWpt',
        'Generate Java tests directly from a local web-platform-tests checkout',
        wptArgs, [wptRoot, wptCssRoot])

registerGenerator('genAll',
        'Run both the taffy fixture and WPT generation pipelines',
        ['--source', 'all',
         '--taffy-root', taffyRoot.absolutePath,
         '--wpt-root', wptRoot.absolutePath] + outputArgs,
        [taffyRoot, wptRoot])

// By default only check categories that already have committed output: current
// upstream taffy also ships fixture categories (contain/float) that this repo
// has intentionally not generated yet.
def committedTaffyDir = new File(outputRoot, 'dev/vfyjxf/taffy/generated')
def committedCategories = committedTaffyDir.isDirectory()
        ? committedTaffyDir.listFiles().findAll { it.isDirectory() }*.name.sort().join(',')
        : ''
def freshnessAllowlist = new File(project.projectDir, 'freshness-allowlist.txt')
def checkTaffyArgs = taffyArgs + ['--check', '--freshness-allowlist', freshnessAllowlist.absolutePath]
if (!project.hasProperty('category') && !committedCategories.isBlank()) {
    checkTaffyArgs = taffyArgs + ['--category', committedCategories, '--check',
                                 '--freshness-allowlist', freshnessAllowlist.absolutePath]
}

registerGenerator('checkGenerated',
        'Regenerate taffy tests into a temp directory and byte-compare with src/test (does not modify it)',
        checkTaffyArgs, [taffyRoot])

registerGenerator('checkWpt',
        'Regenerate WPT tests into a temp directory and byte-compare with src/test (does not modify it)',
        wptArgs + ['--check'], [wptRoot, wptCssRoot])

registerGenerator('checkAll',
        'Byte-compare both generated trees against src/test',
        ['--source', 'all',
         '--taffy-root', taffyRoot.absolutePath,
         '--wpt-root', wptRoot.absolutePath] + outputArgs
                + ['--check', '--freshness-allowlist', freshnessAllowlist.absolutePath],
        [taffyRoot, wptRoot])

// check* tasks verify the committed tree; they belong to the verification group.
['checkGenerated', 'checkWpt', 'checkAll'].each { name ->
    tasks.named(name) {
        group = 'verification'
    }
}

// ---------------------------------------------------------------------------
// Generated-test freshness gate (opt-in; see gentest/README.md)
//
// checkGenerated regenerates the committed taffy categories into a temp
// directory and byte-compares them with src/test/java. Chrome and a Rust taffy
// checkout are required, so the gate is deliberately NOT part of `check` by
// default. Opt in with -Ptaffy.checkGenerated=true (or TAFFY_CHECK_GENERATED=true);
// it is then attached to :gentest:check, which an unqualified `./gradlew check`
// runs in every project.
// ---------------------------------------------------------------------------
def checkGeneratedFreshnessEnabled = {
    def raw = project.findProperty('taffy.checkGenerated')
    if (raw == null || raw.toString().isBlank()) {
        raw = System.getenv('TAFFY_CHECK_GENERATED')
    }
    return raw != null && raw.toString().trim().equalsIgnoreCase('true')
}()

def resolveBuildPath = { String raw ->
    def file = new File(raw)
    return file.isAbsolute() ? file : new File(projectRoot, raw)
}

// Small mirror of ChromeOracle's well-known locations, used only to fail fast
// with actionable advice instead of falling through to a network probe.
def detectCommonChrome = {
    def os = System.getProperty('os.name', '').toLowerCase()
    def home = System.getProperty('user.home', '')
    def candidates = []
    if (os.contains('mac')) {
        candidates += [
                '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome',
                '/Applications/Google Chrome Canary.app/Contents/MacOS/Google Chrome Canary',
                '/Applications/Chromium.app/Contents/MacOS/Chromium',
                new File(home, 'Applications/Google Chrome.app/Contents/MacOS/Google Chrome').path,
                new File(home, 'Applications/Chromium.app/Contents/MacOS/Chromium').path]
    } else if (os.contains('win')) {
        def programFiles = System.getenv('ProgramFiles')
        def programFilesX86 = System.getenv('ProgramFiles(x86)')
        def localAppData = System.getenv('LOCALAPPDATA')
        if (programFiles) {
            candidates += [new File(programFiles, 'Google/Chrome/Application/chrome.exe').path]
        }
        if (programFilesX86) {
            candidates += [new File(programFilesX86, 'Google/Chrome/Application/chrome.exe').path]
        }
        if (localAppData) {
            candidates += [new File(localAppData, 'Google/Chrome/Application/chrome.exe').path]
        }
    } else {
        candidates += [
                '/usr/bin/google-chrome',
                '/usr/bin/google-chrome-stable',
                '/usr/bin/chromium',
                '/usr/bin/chromium-browser',
                '/snap/bin/chromium',
                '/opt/google/chrome/chrome']
    }
    return candidates.find { new File(it).isFile() }
}

tasks.register('checkGeneratedFreshnessPreflight') {
    group = 'verification'
    description = 'Validate the inputs of the opt-in generated-test freshness gate (taffy checkout + Chrome)'
    onlyIf {
        if (!checkGeneratedFreshnessEnabled) {
            logger.lifecycle('Generated-test freshness check is opt-in; skipping preflight.')
            logger.lifecycle('Enable it with: ./gradlew :gentest:checkGeneratedFreshness ' +
                    '-Ptaffy.checkGenerated=true -PtaffyRoot=<taffy checkout>')
            return false
        }
        return true
    }
    doLast {
        if (!taffyRoot.isDirectory()) {
            throw new GradleException("""The generated-test freshness check needs a Rust taffy checkout.
Missing directory: ${taffyRoot}
Set -PtaffyRoot=<checkout> (or TAFFY_ROOT) to a checkout containing test_fixtures/ and scripts/.
The committed generated tests match the historical fixture tree 60601a65^; recreate it with:
  git -C <taffy clone> archive '60601a65^' test_fixtures scripts | tar -x -C /tmp/taffy-2026-03
then rerun with -PtaffyRoot=/tmp/taffy-2026-03.""")
        }
        def fixtures = new File(taffyRoot, 'test_fixtures')
        if (!fixtures.isDirectory()) {
            throw new GradleException("""${fixtures} is not a taffy test_fixtures/ directory.
Point -PtaffyRoot at the Rust checkout root (the directory that contains test_fixtures/ and scripts/).""")
        }
        def chromeHint = 'Install Chrome/Chromium, or pass -PchromeBinary=<path> ' +
                '(or set TAFFY_CHROME_BINARY/CHROME_BIN/CHROME_PATH).'
        if (chromeBinary != null && !chromeBinary.toString().isBlank()) {
            def chrome = resolveBuildPath(chromeBinary.toString())
            if (!chrome.isFile()) {
                throw new GradleException("Chrome binary not found: ${chrome}\n" + chromeHint)
            }
            logger.lifecycle("[checkGeneratedFreshness] Chrome binary: ${chrome}")
        } else {
            def detected = detectCommonChrome()
            if (detected == null) {
                throw new GradleException("No Chrome/Chromium binary was found for the generated-test freshness check.\n" + chromeHint)
            }
            logger.lifecycle("[checkGeneratedFreshness] Chrome binary: ${detected}")
        }
        if (chromeDriver != null && !chromeDriver.toString().isBlank()) {
            def driver = resolveBuildPath(chromeDriver.toString())
            if (!driver.isFile()) {
                throw new GradleException("chromedriver not found: ${driver}\n" +
                        'Check -PchromeDriver (or TAFFY_CHROME_DRIVER/CHROMEDRIVER).')
            }
            logger.lifecycle("[checkGeneratedFreshness] chromedriver: ${driver}")
        } else {
            logger.lifecycle('[checkGeneratedFreshness] chromedriver: not supplied; Selenium Manager ' +
                    'will resolve/download it (network access on first run). ' +
                    'Pass -PchromeDriver=<path> for a hermetic/offline CI run.')
        }
    }
}

tasks.register('checkGeneratedFreshness') {
    group = 'verification'
    description = 'Fail when the committed generated taffy tests are stale ' +
            '(opt-in: -Ptaffy.checkGenerated=true; needs Chrome and a taffy checkout)'
    onlyIf {
        if (!checkGeneratedFreshnessEnabled) {
            logger.lifecycle('Generated-test freshness check is opt-in; skipping.')
            logger.lifecycle('Enable it with: ./gradlew :gentest:checkGeneratedFreshness ' +
                    '-Ptaffy.checkGenerated=true -PtaffyRoot=<taffy checkout> [browser options]')
            return false
        }
        return true
    }
    if (checkGeneratedFreshnessEnabled) {
        dependsOn 'checkGenerated'
    }
}

if (checkGeneratedFreshnessEnabled) {
    tasks.named('checkGenerated') {
        dependsOn 'checkGeneratedFreshnessPreflight'
    }
    tasks.named('check') {
        dependsOn 'checkGeneratedFreshness'
    }
}

// Deprecated alias kept for old build scripts. Prefer genTaffy -Pcategory=...
registerGenerator('genWptFixtures',
        'Deprecated: generate tests from the converted WPT flex_aspect_ratio taffy fixtures',
        taffyArgs + ['--category', 'flex_aspect_ratio'],
        [taffyRoot])

// WPT HTML -> taffy fixture conversion (the WPT source adapter also exposes
// --convert-to-fixtures; this task is the convenient Gradle entry point).
tasks.register('convertWptToFixtures', JavaExec) {
    group = 'generate'
    description = 'Convert WPT HTML tests to taffy fixture format'
    mainClass = 'dev.vfyjxf.taffy.gentest.WptToFixtureConverter'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = projectRoot

    def convertInput = resolvePath('convertInput', 'CONVERT_INPUT',
            new File(wptRoot, 'css/css-sizing/aspect-ratio'))
    def convertOutput = resolvePath('convertOutput', 'CONVERT_OUTPUT',
            new File(taffyRoot, 'test_fixtures/flex_aspect_ratio'))
    def prefix = project.findProperty('convertPrefix') ?: 'wpt_'
    def pattern = project.findProperty('convertPattern') ?: 'flex-aspect-ratio-*.html'

    args = [convertInput.absolutePath, convertOutput.absolutePath,
            '--prefix', prefix.toString(), '--pattern', pattern.toString()]
    doFirst {
        requireDirectories([convertInput])
    }
}

// application plugin run task: no hard-coded Chrome path; pass --args instead.
tasks.named('run') {
    workingDir = projectRoot
}

// ---------------------------------------------------------------------------
// Generator-side contract tests (pure JUnit, no Chrome required)
// ---------------------------------------------------------------------------
test {
    useJUnitPlatform()
}

// Forward the scrollbar-width override to the forked generator JVMs. Gradle's
// -D properties live in the daemon, so JavaExec tasks need an explicit copy.
def expectedScrollbarWidth = System.getProperty('taffy.gentest.expectedScrollbarWidth')
tasks.withType(JavaExec).configureEach {
    if (expectedScrollbarWidth != null && !expectedScrollbarWidth.toString().isBlank()) {
        systemProperty 'taffy.gentest.expectedScrollbarWidth', expectedScrollbarWidth.toString()
    }
}
